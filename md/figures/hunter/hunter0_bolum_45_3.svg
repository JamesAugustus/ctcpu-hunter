<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="30" font-size="18" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">45 / 3: quotient 15, remainder 0</text>
<rect x="20" y="50" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="32" y="75" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Digit 1: 5</text>
<line x1="20" y1="86" x2="390" y2="86" stroke="black"/>
<text x="32" y="109" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">old r = 0</text>
<text x="32" y="132" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">t = 8 x 0 + 5 = 5</text>
<text x="32" y="155" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">quotient digit = 1</text>
<text x="32" y="178" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">new remainder = 2</text>
<rect x="410" y="50" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="422" y="75" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Digit 2: 5</text>
<line x1="410" y1="86" x2="780" y2="86" stroke="black"/>
<text x="422" y="109" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">old r = 2</text>
<text x="422" y="132" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">t = 8 x 2 + 5 = 21</text>
<text x="422" y="155" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">quotient digit = 7</text>
<text x="422" y="178" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">new remainder = 0</text>
</svg>