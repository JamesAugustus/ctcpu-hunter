<svg xmlns="http://www.w3.org/2000/svg" width="800" height="455" viewBox="0 0 800 455">
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="30" font-size="18" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">2124: level descent and reconstruction</text>
<rect x="20" y="50" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="32" y="75" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Strip in channel 3</text>
<line x1="20" y1="86" x2="390" y2="86" stroke="black"/>
<text x="32" y="109" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">v = 59</text>
<text x="32" y="132" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">stripped = 36</text>
<text x="32" y="155" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">36 x 59 = 2124</text>
<rect x="410" y="50" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="422" y="75" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Cut the last digit</text>
<line x1="410" y1="86" x2="780" y2="86" stroke="black"/>
<text x="422" y="109" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">59 = 73_8</text>
<text x="422" y="132" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">a2 = 3</text>
<text x="422" y="155" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">input to level 2 = 7</text>
<text x="422" y="178" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">59 = 8 x 7 + 3</text>
<rect x="20" y="245" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="32" y="270" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Strip at level 2</text>
<line x1="20" y1="281" x2="390" y2="281" stroke="black"/>
<text x="32" y="304" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">channel = 7</text>
<text x="32" y="327" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">e7 = 1</text>
<text x="32" y="350" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">rc = 1</text>
<rect x="410" y="245" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="422" y="270" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Reconstruct</text>
<line x1="410" y1="281" x2="780" y2="281" stroke="black"/>
<text x="422" y="304" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">level 2 = 7</text>
<text x="422" y="327" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">8 x 7 + 3 = 59</text>
<text x="422" y="350" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">36 x 59 = 2124</text>
</svg>