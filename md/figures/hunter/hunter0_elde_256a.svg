<svg xmlns="http://www.w3.org/2000/svg" width="800" height="455" viewBox="0 0 800 455">
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="30" font-size="18" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">256: first divisions</text>
<rect x="20" y="50" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="32" y="75" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Descent 0</text>
<line x1="20" y1="86" x2="390" y2="86" stroke="black"/>
<text x="32" y="109" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">remainder = 256</text>
<text x="32" y="132" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">stripped = 1</text>
<text x="32" y="155" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">rs1 = 0, rs2 = 0</text>
<text x="32" y="178" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">exponent = 0 + 8 x 0 = 0</text>
<rect x="410" y="50" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="422" y="75" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Descent 1</text>
<line x1="410" y1="86" x2="780" y2="86" stroke="black"/>
<text x="422" y="109" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">remainder = 128</text>
<text x="422" y="132" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">stripped = 2</text>
<text x="422" y="155" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">rs1 = 1, rs2 = 0</text>
<text x="422" y="178" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">exponent = 1 + 8 x 0 = 1</text>
<rect x="20" y="245" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="32" y="270" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Descent 2</text>
<line x1="20" y1="281" x2="390" y2="281" stroke="black"/>
<text x="32" y="304" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">remainder = 64</text>
<text x="32" y="327" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">stripped = 4</text>
<text x="32" y="350" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">rs1 = 2, rs2 = 0</text>
<text x="32" y="373" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">exponent = 2 + 8 x 0 = 2</text>
<rect x="410" y="245" width="370" height="175" fill="white" stroke="black" stroke-width="2"/>
<text x="422" y="270" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Descent 3</text>
<line x1="410" y1="281" x2="780" y2="281" stroke="black"/>
<text x="422" y="304" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">remainder = 32</text>
<text x="422" y="327" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">stripped = 8</text>
<text x="422" y="350" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">rs1 = 3, rs2 = 0</text>
<text x="422" y="373" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">exponent = 3 + 8 x 0 = 3</text>
</svg>