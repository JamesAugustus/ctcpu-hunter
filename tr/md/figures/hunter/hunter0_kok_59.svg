<svg xmlns="http://www.w3.org/2000/svg" width="800" height="455" viewBox="0 0 800 455">
<rect width="100%" height="100%" fill="white" />
<text x="20" y="30" font-size="18" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">59: üç ikili hücre, bir sekizlik kök hanesi</text>
<rect x="20" y="50" width="370" height="175" fill="white" stroke="black" stroke-width="2" />
<text x="32" y="75" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Hücre 1</text>
<line x1="20" y1="86" x2="390" y2="86" stroke="black" />
<text x="32" y="109" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">girdi çifti = 11</text>
<text x="32" y="132" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">ara artık = 3</text>
<text x="32" y="155" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">bedel = 1, bit = 1</text>
<text x="32" y="178" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">kök = 1, artık = 2</text>
<rect x="410" y="50" width="370" height="175" fill="white" stroke="black" stroke-width="2" />
<text x="422" y="75" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Hücre 2</text>
<line x1="410" y1="86" x2="780" y2="86" stroke="black" />
<text x="422" y="109" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">girdi çifti = 10</text>
<text x="422" y="132" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">ara artık = 10</text>
<text x="422" y="155" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">bedel = 5, bit = 1</text>
<text x="422" y="178" font-size="14" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">kök = 3, artık = 5</text>
<rect x="20" y="245" width="370" height="175" fill="white" stroke="black" stroke-width="2" />
<text x="32" y="270" font-size="16" text-anchor="start" font-family="Liberation Mono,monospace" fill="black">Hücre 3</text>
